name: EventSphere FastAPI CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server_py/requirements.txt
      - run: python -m pytest server_py/tests -q
      - run: npm install
      - run: npm run build
